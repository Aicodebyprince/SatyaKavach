services:
  - type: web
    name: satyakavach-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: "satyakavach-media"
      - key: AWS_DEFAULT_REGION
        value: "auto"
      - key: CORS_ORIGINS
        value: "https://satyakavach.vercel.app,http://localhost:5173"
